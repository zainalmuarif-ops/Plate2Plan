const NUMRE=/\d+(?:[.,]\d+)*/g,HAS=Object.prototype.hasOwnProperty;
function tr(s){const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0],core=s.trim();if(!core)return s;
  const nums=core.match(NUMRE)||[],key=core.replace(NUMRE,'§');let out=core;
  if(HAS.call(ENX,key)){let i=0;out=ENX[key].replace(/§/g,()=>i<nums.length?nums[i++]:'§')}
  for(const [a,b] of VOCX)if(out.includes(a))out=out.split(a).join(b);
  return lead+out+trail}

  else if(a==='publish'){S.scan[S.sppg+S.day].sent=true;toast('Data ompreng '+S.day+' terkirim ke aplikasi siswa')}
  else if(a==='rb'){S.rb=v}
  else if(a==='rc'){const r=rcvOf(S.day,S.rb);r.c[+t.dataset.i]=v;r.saved=false}
  else if(a==='es'){const r=rcvOf(S.day,S.rb);r.es=v;r.saved=false}
  else if(a==='saveRcv'){const st=rcvState(S.day,S.rb),id=logId(S.day,S.rb);st.rec.saved=true;S.rcvLog=S.rcvLog.filter(x=>x.id!==id);S.rcvLog.push({id,tgl:DT[S.day],sppg:S.sppg,kode:S.rb,supplier:F[S.rb].supplier,pesan:st.pesan,tolak:st.tolak,alasan:st.tolak?st.alasan:'',status:st.status});toast('Penerimaan '+F[S.rb].pendek+' tersimpan'+(st.tolak?'. Dicatat di riwayat mutu pemasok':''))}
  else if(a==='proc'){S.proc[v]=!S.proc[v]}
  else if(a==='sendHimb'){const sp=S.limF==='ALL'?'S1':S.limF;S.himb.push({sppg:sp,isi:HIMB[S.himbT],dari:'Pengelola Limbah'});toast('Himbauan terkirim ke '+SP[sp].nama)}
  else if(a==='sendTawar'){const sp=S.limF==='ALL'?'S1':S.limF,o=olah(sp,LAST),pr=PROD[S.tProd];S.tawar.push({id:'t'+(S.tawar.length+1),prod:S.tProd,kg:Math.round(o[pr.f]),sup:S.tSup,sppg:sp,dari:KB[sp],minat:false});toast('Tawaran terkirim ke pemasok')}
  else if(a==='pkOk'){S.pk[v]=Object.assign(S.pk[v]||{},{ok:true,serah:null});toast('Jadwal jemput dikonfirmasi')}
  else if(a==='pkSerah'){const k=v;camOpen('Scan dan timbang serah terima · '+k.replace('|',' · '),'k|'+k,()=>{const [sp,h]=k.split('|');S.pk[k]={ok:true,serah:Math.round(predKg(sp,h)*0.96)};toast('Serah terima tercatat, terbaca dapur dan investor')});return}
  else if(a==='minat'){const x=S.tawar.find(y=>y.id===v);if(x)x.minat=!x.minat}
  else if(a==='apply'){const st=itemStats(S.sppg),hi=new Set(st.filter(x=>x.avg>25).map(x=>x.k));let n=0;D.hari.forEach(h=>S.plan[h].forEach(l=>{if(hi.has(l[0])){l[1]=Math.round(l[1]*0.8/5)*5;n++}}));toast(n+' porsi bahan dikurangi 20%. Pre-order ikut berubah')}
  else if(a==='reset'){S.plan=clone(D.menu);toast('Menu dikembalikan ke rencana awal')}
  else if(a==='send'){S.sent[S.sppg]=true;toast('Pre-order terkirim ke supplier dan dilaporkan ke Investor')}
  else if(a==='stuDay'){S.stu.day=v;S.stu.step=0;S.stu.sisa={}}
  else if(a==='scanBefore'){camOpen('Scan ompreng sebelum makan','s|'+S.user.u+'|'+S.stu.day+'|b',doBefore);return}
  else if(a==='scanAfter'){camOpen('Scan ompreng sesudah makan','s|'+S.user.u+'|'+S.stu.day+'|a',doAfter);return}
  else if(a==='toSaran'){S.stu.step=3}
  else if(a==='rate'){const r=S.stu.rating;r[v]=r[v]==='suka'?'tidak':r[v]==='tidak'?undefined:'suka'}
  else if(a==='sendSaran'){const st=S.stu,txt=($('#stuTxt')?.value||'').trim();const k=SK[S.user.sekolah];const neg=Object.values(st.rating).filter(x=>x==='tidak').length,pos=Object.values(st.rating).filter(x=>x==='suka').length;
    const parts=Object.entries(st.rating).filter(x=>x[1]).map(([c,r])=>`${F[c].pendek} (${r})`);const isi=[txt,parts.join(', ')].filter(Boolean).join(' · ');
    if(!isi){toast('Tulis saran atau pilih penilaian dulu');return}
    S.saran.push({id:S.saran.length+1,tanggal:'2026-11-16',sekolah:k.id,sppg:k.sppg,jenjang:k.jenjang,kategori:'Umum',sentimen:neg>pos?'negatif':pos>neg?'positif':'netral',isi});S.stu.txt='';S.stu.rating={};toast('Saran terkirim ke dapur dan Investor')}
  else if(a==='stuReset'){S.stu={...S.stu,step:0,sisa:{},rating:{},txt:''}}
  render()});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(!t)return;const a=t.dataset.chg,v=t.value;
  if(a==='lim')S.limF=v;else if(a==='himbT')S.himbT=+v;else if(a==='tProd')S.tProd=v;else if(a==='tSup')S.tSup=v;else if(a==='bgn')S.bgn=v;else if(a==='wa')S.waSup=v;
  else if(a==='stuP'){S.stu.profil=v;S.stu.sisa={};S.stu.step=0}
  else if(a==='gram'){S.plan[t.dataset.d][+t.dataset.i][1]=Math.max(0,+v||0)}
  else if(a==='price'){S.price[t.dataset.k]=Math.max(0,+v||0);toast('Penawaran harga terkirim ke dapur')}
  else if(a==='susut'){S.susut=Math.max(0,+v||0)}
  else if(a==='rtolak'||a==='rsuhu'||a==='ralasan'){const r=rcvOf(S.day,S.rb);if(a==='rtolak')r.tolak=Math.max(0,+v||0);if(a==='rsuhu')r.suhu=+v||0;if(a==='ralasan')r.alasan=v;r.saved=false}
  render()});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(!t)return;
  if(t.dataset.inp==='lu')S.lu=t.value;if(t.dataset.inp==='lp')S.lp=t.value;
  if(t.dataset.inp==='sisa'){S.stu.sisa[t.dataset.v]=+t.value;$('#s_'+t.dataset.v).textContent=t.value+'%';stuSum()}
  if(t.dataset.inp==='org'){const o=S.scan[S.sppg+S.day].org;o[t.dataset.v]=+t.value;$('#o_'+t.dataset.v).textContent=t.value;$('#mutu').textContent=fmt(avg(Object.values(o)),1)}});
document.addEventListener('submit',e=>{if(e.target.id!=='loginForm')return;e.preventDefault();
  const u=S.lu.trim().toLowerCase(),a=ACC.find(x=>x.role===S.loginRole&&x.u.toLowerCase()===u&&x.p===S.lp);
  if(!a){S.err='Username atau kata sandi salah, atau akun ini bukan untuk peran yang dipilih.';render();return}
  S.err='';S.lp='';S.user=a;S.role=a.role==='pub'?'bgn':a.role;S.bgn='ALL';
  if(a.sppg)S.sppg=a.sppg;if(a.sup)S.sup=a.sup;if(a.profil){S.stu.profil=a.profil;S.stu.step=0;S.stu.sisa={}}
  S.rs=1;render();toast('Masuk sebagai '+a.nama)});
function initSplash(){const sp=$('#splash'),wm=$('#wm'),view=$('#view');if(!sp)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  wm.innerHTML='Plate2Plan'.split('').map((c,i)=>`<span class="lw"><span class="lt${c==='2'?' two':''}" style="--i:${i}">${c}</span></span>`).join('');
  const lws=[...wm.children];let px=-999,py=-999,alive=true;view.inert=true;
  function frame(){if(!alive)return;const r=wm.getBoundingClientRect();
    lws.forEach(l=>{const cx=r.left+l.offsetLeft+l.offsetWidth/2,cy=r.top+l.offsetTop+l.offsetHeight/2,dx=cx-px,dy=cy-py,d=Math.hypot(dx,dy)||1,R=120;
      if(d<R){const k=(R-d)/R;l.style.transform=`translate(${dx/d*k*36}px,${dy/d*k*36}px) rotate(${dx/d*k*14}deg)`}else l.style.transform=''});
    requestAnimationFrame(frame)}
  if(!reduce)requestAnimationFrame(frame);
  const move=e=>{px=e.clientX;py=e.clientY};
  sp.addEventListener('pointermove',move);
  sp.addEventListener('pointerleave',()=>{px=py=-999});
  sp.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){px=py=-999}});
  sp.addEventListener('pointerdown',e=>{if(e.target.id==='skip')return;move(e);const b=sp.getBoundingClientRect(),rp=document.createElement('span');rp.className='rip';rp.style.left=(e.clientX-b.left)+'px';rp.style.top=(e.clientY-b.top)+'px';sp.appendChild(rp);setTimeout(()=>rp.remove(),900);
    if(!reduce&&lws[0].animate)lws.forEach((l,i)=>l.animate([{translate:'0 0',scale:'1'},{translate:'0 -26px',scale:'1.18'},{translate:'0 0',scale:'1'}],{duration:600,delay:i*45,easing:'ease-out'}))});
  let done=false;function finish(){if(done)return;done=true;sp.classList.add('out');view.inert=false;setTimeout(()=>{alive=false;sp.remove()},700)}
  $('#skip').addEventListener('click',finish);setTimeout(finish,reduce?2000:5000)}
(function(){let t=null;try{t=localStorage.getItem('p2p-theme')}catch(e){}setTheme(t||document.documentElement.dataset.theme||'light')})();
render();
if(LANG==='en'){document.documentElement.lang='en';trTree(document.body)}
initSplash();
</script>
